<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="32x32" href="/la-dalle-favicon-32.png" />
    <!-- Google recommande une icône carrée multiple de 48px pour l'afficher dans les résultats de
         recherche (32x32 est en-dessous du seuil) — voir la question du 02/08/2026. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/la-dalle-favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/la-dalle-favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Artisans du bâtiment d'Ariège et de l'Aude : fiche Google et site vitrine tenus à jour toute l'année, bilan à 60 jours comparé au jour 0. Basé à Mirepoix." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ladalle-agence.fr/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://ladalle-agence.fr/" />
    <meta property="og:title" content="La Dalle — un site qui tient, pour les artisans d'Ariège" />
    <meta property="og:description" content="Artisans du bâtiment d'Ariège et de l'Aude : fiche Google et site vitrine tenus à jour toute l'année, bilan à 60 jours comparé au jour 0. Basé à Mirepoix." />
    <meta property="og:image" content="https://ladalle-agence.fr/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="La Dalle — un site qui tient, pour les artisans d'Ariège" />
    <meta name="twitter:description" content="Artisans du bâtiment d'Ariège et de l'Aude : fiche Google et site vitrine tenus à jour toute l'année, bilan à 60 jours comparé au jour 0. Basé à Mirepoix." />
    <meta name="twitter:image" content="https://ladalle-agence.fr/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@800&family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@800&family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap"
      />
    </noscript>
    <title>La Dalle — Agence web pour artisans d'Ariège & de l'Aude</title>
    <script>
      // Applique le thème avant le premier paint pour éviter un flash clair→sombre (cf. useTheme.js)
      try {
        var stored = localStorage.getItem('presence-locale-theme')
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (isDark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Formulaire fantôme statique : permet à Netlify de détecter le formulaire au build
         (le vrai formulaire est rendu en React, invisible au parseur HTML de Netlify sans ceci)
         et d'envoyer une notification email — voir ContactForm.jsx pour la soumission réelle. -->
    <form name="contact" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="text" name="contact" />
      <textarea name="message"></textarea>
      <input type="text" name="website" />
    </form>
    <noscript>
      <div style="max-width: 640px; margin: 3rem auto; padding: 0 1.5rem; font-family: sans-serif; color: #1c2b33;">
        <h1>La Dalle — Fiche Google et site vitrine pour artisans du bâtiment d'Ariège et de l'Aude</h1>
        <p>Fiche Google optimisée puis tenue à jour chaque mois, site vitrine avec galerie de chantiers, bilan à 60 jours comparé au jour 0. 1 460 € HT la première année, puis 470 €/an (TVA non applicable, art. 293 B du CGI). Basé à Mirepoix, jusqu'à 50 km par la route.</p>
        <p>Téléphone : 06 33 24 69 70 — Email : presencelocale.contact@gmail.com</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
